schema_version: 1

context:
  version: "0.9.10"

package:
  name: libunistring
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/libunistring/libunistring-${{ version }}.tar.xz
  sha256: eb8fb2c3e4b6e2d336608377050892b54c3c983b646c561836550863003c05d7

build:
  number: 0
  skip: win

requirements:
  build:
    - if: unix
      then: gnuconfig
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
  run_exports:
    - ${{ pin_subpackage('libunistring', lower_bound='x', upper_bound='x') }}

tests:
  - package_contents:
      lib:
        - unistring

about:
  license: GPL-3.0-only OR LGPL-3.0-only
  license_file:
    - COPYING
    - COPYING.LIB
  summary: This library provides functions for manipulating Unicode strings and for manipulating C strings according to the Unicode standard.
  homepage: https://www.gnu.org/software/libunistring

extra:
  recipe-maintainers:
    - stefan-balke
    - bgruening
